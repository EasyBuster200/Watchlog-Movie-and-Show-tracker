<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap">
<style>body{margin:0;background:var(--bg-page);font-family:var(--font-sans);color:var(--text-primary)}</style>
</head>
<body>
<div id="root" class="tt-root" style="padding:16px;max-width:390px"></div>
<script>
var h = React.createElement, T = window.TVTracker;
ReactDOM.createRoot(document.getElementById('root')).render(h(T.BrowseHeader, {
  title: 'Browse All Movies', placement: 'anchored',
  sortOptions: ['Popular', 'Top rated', 'Newest'],
  sections: [
    { id: 'type', label: 'Show', kind: 'single', options: ['All', 'Movies', 'Shows'] },
    { id: 'genres', label: 'Genres', kind: 'multi', options: ['Action', 'Comedy', 'Crime', 'Drama', 'Horror', 'Mystery', 'Sci-Fi', 'Thriller'], value: ['Drama'] }
  ]
}));
</script>
</body>
</html>

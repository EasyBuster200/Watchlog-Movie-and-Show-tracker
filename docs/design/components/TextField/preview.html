<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap">
<style>body{margin:0;background:var(--bg-page);font-family:var(--font-sans);color:var(--text-primary)}</style>
</head>
<body>
<div id="root" class="tt-root" style="width:340px;padding:16px;display:flex;flex-direction:column;gap:16px"></div>
<script>
var h = React.createElement, T = window.TVTracker;
ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment,null,
  h(T.TextField,{label:'Email',type:'email',icon:'mail',defaultValue:'duarte@example.com'}),
  h(T.TextField,{label:'Password',type:'password',icon:'lock',defaultValue:'popcorn42',helper:'At least 8 characters'}),
  h(T.TextField,{label:'Email',type:'email',icon:'mail',defaultValue:'duarte@',error:'Enter a valid email address'})
));
</script>
</body>
</html>

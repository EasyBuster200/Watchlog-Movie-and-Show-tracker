<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#14151c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Watchlog">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="images/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <title>Robot check</title>
  <!-- The bot check (server/src/turnstile.js), shown in a frame by the sign-in screens. Not a page
       of its own: it has no navigation and sends its result to the screen that framed it. -->
  <style>
    html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
    #check { display: flex; justify-content: center; }
  </style>
  <script type="text/javascript" src="scripts/pwa.js" defer></script>
  <script type="text/javascript" src="scripts/turnstile-frame.js"></script>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&amp;onload=watchlogTurnstileLoaded" async defer></script>
</head>
<body>
  <div id="check"></div>
</body>
</html>

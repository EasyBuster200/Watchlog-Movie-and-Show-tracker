<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#14151c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Watchlog">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="images/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <title>Who's watching?</title>
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/style.css">
  <script type="text/javascript" src="scripts/theme.js"></script>
  <script type="text/javascript" src="scripts/pwa.js" defer></script>
  <script type="text/javascript" src="scripts/vendor/capacitor.js"></script>
  <script type="text/javascript" src="scripts/vendor/capacitor-filesystem.js"></script>
  <script type="text/javascript" src="scripts/vendor/capacitor-share.js"></script>
  <script type="text/javascript" src="scripts/vendor/capacitor-local-notifications.js"></script>
  <script type="text/javascript" src="scripts/localDb.js" defer></script>
  <script type="text/javascript" src="scripts/profiles.js" defer></script>
  <script type="text/javascript" src="scripts/serverApi.js" defer></script>
  <script type="text/javascript" src="scripts/media.js" defer></script>
  <script type="text/javascript" src="scripts/notifications.js" defer></script>
  <script type="text/javascript" src="scripts/backup.js" defer></script>
  <script type="text/javascript" src="scripts/profile-picker.js" defer></script>
</head>
<body>
  <!-- Every screen (Who's watching?, the offline profile form, Import a backup, and the online
       account screens) is drawn into #auth by profile-picker.js; the TMDB credit stays below. -->
  <main class="auth">
    <!-- Laptops only (style.css): a mosaic of this week's trending posters beside the form. -->
    <aside class="auth__mosaic" id="auth-mosaic" aria-hidden="true"></aside>
    <div class="auth__panel">
      <div class="auth__col" id="auth"></div>
      <footer class="auth__credit">
        <a href="https://www.themoviedb.org/" target="_blank" rel="noopener noreferrer">
          <img src="images/tmdb-logo.svg" alt="TMDB">
        </a>
        <p>This app uses TMDB and the TMDB APIs but is not endorsed, certified, or otherwise approved by TMDB. Each profile uses its own TMDB API key. Get a free one at <a href="https://www.themoviedb.org/settings/api" target="_blank" rel="noopener noreferrer">themoviedb.org</a>.</p>
      </footer>
    </div>
    <input type="file" id="import-backup-input" accept="application/json,.json" hidden>
  </main>
</body>
</html>

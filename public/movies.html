<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#14151c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Watchlog">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="images/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <title>Movies</title>
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/style.css">
  <script type="text/javascript" src="scripts/theme.js"></script>
  <script type="text/javascript" src="scripts/pwa.js" defer></script>
  <script type="text/javascript" src="scripts/vendor/capacitor.js"></script>
  <script type="text/javascript" src="scripts/vendor/capacitor-filesystem.js"></script>
  <script type="text/javascript" src="scripts/vendor/capacitor-local-notifications.js"></script>
  <script type="text/javascript" src="scripts/standardItem.js" defer></script>
  <script type="text/javascript" src="scripts/localDb.js" defer></script>
  <script type="text/javascript" src="scripts/localApi.js" defer></script>
  <script type="text/javascript" src="scripts/profiles.js" defer></script>
  <script type="text/javascript" src="scripts/serverApi.js" defer></script>
  <script type="text/javascript" src="scripts/sync.js" defer></script>
  <script type="text/javascript" src="scripts/backup.js" defer></script>
  <script type="text/javascript" src="scripts/autoBackup.js" defer></script>
  <script type="text/javascript" src="scripts/notifications.js" defer></script>
  <script type="text/javascript" src="scripts/auth.js" defer></script>
  <script type="text/javascript" src="scripts/media.js" defer></script>
  <script type="text/javascript" src="scripts/search.js" defer></script>
  <script type="text/javascript" src="scripts/browse.js" defer></script>
  <script type="text/javascript" src="scripts/movies.js" defer></script>
</head>
<body>
  <main class="screen">
    <div class="stack">
      <h1 class="screen-title">Movies</h1>
      <div class="search-bar">
        <label class="tt-search">
          <svg class="tt-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14z"></path><path d="M20.5 20.5l-4.5-4.5"></path></svg>
          <span class="tt-sr">Search movies</span>
          <input type="search" id="search-input" data-search-type="movie" placeholder="Search movies…" autocomplete="off" enterkeyhint="search">
        </label>
        <div class="search-results" id="search-results" hidden></div>
      </div>
    </div>

    <section class="stack">
      <div class="tt-section"><h2>Popular</h2><a class="tt-link" href="media-list.html?source=popular&amp;type=movie">See all</a></div>
      <div class="poster-row" id="popular-movies"></div>
    </section>

    <section class="stack">
      <div class="tt-section"><h2>Coming Soon</h2><a class="tt-link" href="media-list.html?source=upcoming&amp;type=movie">See all</a></div>
      <div class="poster-row" id="upcoming-movies"></div>
    </section>

    <section class="stack">
      <div class="tt-section"><h2>Recommended</h2><a class="tt-link" href="media-list.html?source=recommended&amp;type=movie">See all</a></div>
      <div class="poster-row" id="recommended-movies"></div>
    </section>

    <section class="stack">
      <div id="browse-header"></div>
      <p class="empty-note" id="browse-empty" hidden>Nothing matches these genres on this page. Try removing one.</p>
      <div class="poster-grid" id="browse-grid"></div>
      <nav class="pager" id="browse-pagination"></nav>
    </section>
  </main>
  <nav class="tt-nav" data-active="movies"></nav>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#14151c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Watchlog">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="images/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <title>Person</title>
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/style.css">
  <script type="text/javascript" src="scripts/theme.js"></script>
  <script type="text/javascript" src="scripts/pwa.js" defer></script>
  <script type="text/javascript" src="scripts/vendor/capacitor.js"></script>
  <script type="text/javascript" src="scripts/vendor/capacitor-filesystem.js"></script>
  <script type="text/javascript" src="scripts/vendor/capacitor-local-notifications.js"></script>
  <script type="text/javascript" src="scripts/standardItem.js" defer></script>
  <script type="text/javascript" src="scripts/localDb.js" defer></script>
  <script type="text/javascript" src="scripts/localApi.js" defer></script>
  <script type="text/javascript" src="scripts/profiles.js" defer></script>
  <script type="text/javascript" src="scripts/serverApi.js" defer></script>
  <script type="text/javascript" src="scripts/sync.js" defer></script>
  <script type="text/javascript" src="scripts/backup.js" defer></script>
  <script type="text/javascript" src="scripts/autoBackup.js" defer></script>
  <script type="text/javascript" src="scripts/notifications.js" defer></script>
  <script type="text/javascript" src="scripts/auth.js" defer></script>
  <script type="text/javascript" src="scripts/media.js" defer></script>
  <script type="text/javascript" src="scripts/person.js" defer></script>
</head>
<body>
  <main class="screen">
    <button type="button" class="tt-back" data-back="main.html" aria-label="Back">
      <svg class="tt-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"></path><path d="M11 6l-6 6 6 6"></path></svg>
    </button>

    <section class="actor-head" aria-label="Profile">
      <div class="actor-head__photo" id="person-photo"></div>
      <div class="actor-head__info">
        <span class="actor-head__dept" id="person-dept"></span>
        <h1 class="screen-title" id="person-name"></h1>
        <span class="actor-head__line" id="person-born"></span>
        <span class="actor-head__line" id="person-place"></span>
      </div>
    </section>

    <section class="stack-sm">
      <h2 class="section-title">Biography</h2>
      <p class="detail-overview clamp clamp--3" id="person-biography"></p>
      <button type="button" class="tt-link" id="bio-toggle-btn" hidden>Show more</button>
    </section>

    <section class="stack" id="known-for-section" hidden>
      <div class="tt-section"><h2>Known For</h2></div>
      <div class="poster-row" id="known-for"></div>
    </section>

    <section class="stack">
      <div id="filmography-filters"><div class="tt-section"><h2>Filmography</h2><span class="muted-note">Newest first</span></div></div>
      <div class="poster-grid" id="filmography-grid"></div>
      <p class="empty-note" id="filmography-empty" hidden>No filmography available.</p>
      <nav class="pager" id="filmography-pagination"></nav>
    </section>
  </main>
  <nav class="tt-nav" data-active=""></nav>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#14151c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Watchlog">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="images/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <title>Settings</title>
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/style.css">
  <script type="text/javascript" src="scripts/theme.js"></script>
  <script type="text/javascript" src="scripts/pwa.js" defer></script>
  <script type="text/javascript" src="scripts/vendor/capacitor.js"></script>
  <script type="text/javascript" src="scripts/vendor/capacitor-filesystem.js"></script>
  <script type="text/javascript" src="scripts/vendor/capacitor-share.js"></script>
  <script type="text/javascript" src="scripts/vendor/capacitor-local-notifications.js"></script>
  <script type="text/javascript" src="scripts/standardItem.js" defer></script>
  <script type="text/javascript" src="scripts/localDb.js" defer></script>
  <script type="text/javascript" src="scripts/localApi.js" defer></script>
  <script type="text/javascript" src="scripts/profiles.js" defer></script>
  <script type="text/javascript" src="scripts/serverApi.js" defer></script>
  <script type="text/javascript" src="scripts/sync.js" defer></script>
  <script type="text/javascript" src="scripts/backup.js" defer></script>
  <script type="text/javascript" src="scripts/autoBackup.js" defer></script>
  <script type="text/javascript" src="scripts/notifications.js" defer></script>
  <script type="text/javascript" src="scripts/auth.js" defer></script>
  <script type="text/javascript" src="scripts/media.js" defer></script>
  <script type="text/javascript" src="scripts/settings.js" defer></script>
</head>
<body>
  <main class="screen settings-screen">
    <div class="page-header__row">
      <button type="button" class="tt-back" data-back="profile.html" aria-label="Back to Profile">
        <svg class="tt-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"></path><path d="M11 6l-6 6 6 6"></path></svg>
      </button>
      <h1 class="screen-title">Settings</h1>
    </div>

    <div class="settings-layout">
    <nav class="settings-nav web-only" id="settings-nav" aria-label="Settings sections">
      <a href="#profile">Profile</a><a href="#appearance">Appearance</a><a href="#notifications">Notifications</a><a href="#library">Library</a><a href="#data">Data &amp; backup</a><a href="#online">Online account</a><a href="#account">Account</a><a href="#about">About</a>
    </nav>
    <div class="settings-main">
    <section class="settings-section web-only" id="profile">
      <div class="settings-card settings-webprofile">
        <span class="settings-webprofile__avatar" id="settings-web-avatar" aria-hidden="true"></span>
        <span class="settings-profile__text">
          <span class="settings-webprofile__name" id="settings-web-name"></span>
          <span class="settings-row__sub" id="settings-web-sub"></span>
        </span>
        <button type="button" class="settings-row__btn" id="settings-web-edit">Edit name and TMDB token</button>
      </div>
    </section>

    <button type="button" class="settings-profile phone-only" id="settings-profile">
      <span class="settings-profile__avatar" id="settings-avatar" aria-hidden="true"></span>
      <span class="settings-profile__text">
        <span class="settings-profile__name" id="settings-name"></span>
        <span class="settings-profile__sub" id="settings-profile-sub"></span>
      </span>
      <span class="list-row__chevron"><svg class="tt-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></span>
    </button>

    <section class="settings-section" id="appearance">
      <h2 class="tt-filter-label settings-section__title">Appearance</h2>
      <div class="settings-card">
        <div class="settings-block">
          <div class="settings-block__head">
            <span class="settings-block__title">Theme</span>
            <span class="muted-note web-only">Dark, light, or whatever your device uses</span>
          </div>
          <div class="chip-wrap" role="group" aria-label="Theme" id="theme-chips"></div>
        </div>
        <div class="settings-block">
          <div class="settings-block__head">
            <span class="settings-block__title">Accent colour</span>
            <span class="muted-note" id="accent-name"></span>
          </div>
          <div class="swatches" role="group" aria-label="Accent colour" id="accent-swatches"></div>
        </div>
      </div>
    </section>

    <div id="settings-sections"></div>

    <span class="app-version" id="app-version">Watchlog</span>
    </div>
    </div>
    <input type="file" id="import-app-input" accept="application/json" hidden>
  </main>
  <nav class="tt-nav" data-active="profile"></nav>
</body>
</html>

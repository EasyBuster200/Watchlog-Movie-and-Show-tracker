name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # The project stays on Node 18 (see CLAUDE.md's Capacitor note), so test there.
          node-version: 18
          cache: npm
      - run: npm ci
      - run: npm test
      # The server (Cloudflare Worker) tests use node:sqlite, which needs Node 22.5+. They're in
      # this same job so the one required "test" check covers them too.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm run test:server

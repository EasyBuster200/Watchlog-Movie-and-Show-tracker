name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The project stays on Node 18 (see CLAUDE.md's Capacitor note), so test there.
          node-version: 18
          cache: npm
      - run: npm ci
      - run: npm test
